
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ROYAL WIN — Official</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Poppins,Arial,sans-serif;
  color:#fff;
  background:#050300;
  overflow:hidden;
}

/* ROYAL GOLD GLOW BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:-50%;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,218,106,0.18), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(201,146,0,0.16), transparent 42%),
    radial-gradient(circle at 50% 50%, rgba(255,218,106,0.12), transparent 45%);
  animation:goldMove 18s linear infinite;
}

@keyframes goldMove{
  0%{transform:translate(0,0)}
  50%{transform:translate(-6%, -8%)}
  100%{transform:translate(0,0)}
}

.card{
  position:relative;
  z-index:2;
  width:420px;
  max-width:95%;
  background:linear-gradient(180deg,#120c02,#050300);
  border-radius:30px;
  padding:32px 24px 36px;
  text-align:center;
  box-shadow:0 40px 100px rgba(0,0,0,0.9);
}

/* DP HEARTBEAT */
.dp-wrap{
  width:140px;
  height:140px;
  margin:18px auto 22px;
}
.dp{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  border:6px solid #ffda6a;
  box-shadow:0 0 35px rgba(255,218,106,.9);
  animation:heartbeat 1.6s infinite;
}
@keyframes heartbeat{
  0%{transform:scale(1)}
  14%{transform:scale(1.12)}
  28%{transform:scale(1)}
  42%{transform:scale(1.12)}
  70%{transform:scale(1)}
}
.dp img{width:100%;height:100%;object-fit:cover;}

h1{margin:6px 0;font-size:24px;color:#ffda6a;}
.sub{font-size:14px;opacity:.9;margin-bottom:10px;}
.headline{font-size:22px;font-weight:700;margin-bottom:10px;}
.list{font-size:14px;opacity:.9;line-height:1.7;margin-bottom:16px;}

/* COUNTDOWN */
.countdown{
  font-size:36px;
  font-weight:900;
  color:#ffda6a;
  margin:14px 0 18px;
  transition:.3s;
}
.shake{
  animation:shake .4s infinite;
}
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-4px)}
  50%{transform:translateX(4px)}
  75%{transform:translateX(-4px)}
  100%{transform:translateX(0)}
}
.glow{
  text-shadow:0 0 10px #ffda6a,0 0 25px #ffda6a;
}

.btn{
  display:block;
  background:linear-gradient(180deg,#ffda6a,#c99200);
  color:#2a1b00;
  font-weight:900;
  padding:16px;
  border-radius:18px;
  text-decoration:none;
  letter-spacing:.5px;
  box-shadow:0 25px 60px rgba(255,218,106,.7);
}
.small{margin-top:12px;font-size:13px;opacity:.7;}
</style>
</head>
<body>

<div class="card">

  <h1>ROYAL WIN</h1>
  <div class="sub">India’s Most Trusted Cricket Analyst ✍️</div>

  <div class="dp-wrap">
    <div class="dp"><img src="dp.jpg"></div>
  </div>

  <div class="headline">We Analyze • You Profit 💰</div>

  <div class="list">
    ✔ League & International Matches<br>
    ✔ Trusted Since 2015<br>
    ✔ VIP & Paid Predictions Available
  </div>

  <div class="countdown" id="timer">54</div>

  <a class="btn" href="https://t.me/+KFLtKWNsVKo2NDI1" target="_blank">
    JOIN TELEGRAM
  </a>

  <div class="small">🔒 Secure • No Spam • Instant Access</div>

</div>

<script>
let t=54;
const timer=document.getElementById("timer");
setInterval(()=>{
  if(t>0){
    t--;
    timer.innerText=t;
    if(t<=5){
      timer.classList.add("shake","glow");
    }
  }
},1000);
</script>

</body>
</html>
